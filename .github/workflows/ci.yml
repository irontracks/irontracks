name: IronTracks CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ⚠️ O E2E logado usa UMA conta real e compartilhada (`djmkbrasil`), e a sessão
# de treino em andamento vive no SERVIDOR (`active_workout_sessions`) — não no
# navegador. Dois runs ao mesmo tempo brigam pela mesma linha: um deles chama
# `descartarSessao()` na sessão que o outro acabou de abrir, e o perdedor cai
# em "a lista de treinos precisa ter ao menos um card", sem nada a ver com o
# diff que está sendo testado.
#
# Não é hipótese — foi medido em 24/08/2026, no PR #909, com precisão de
# segundos: o E2E do run que passou ocupou 16:37:42→16:38:11 e o do run que
# falhou 16:37:54→16:40:13. **17 segundos de sobreposição**, e a sessão ativa
# nasceu 16:37:58, dentro deles. Eram dois commits da MESMA branch (o código e,
# dois minutos depois, um commit só de documentação): sem esta trava, o push
# seguinte não cancela o run anterior e os dois disputam a conta.
#
# `cancel-in-progress: true` é o que impede a sobreposição — o run obsoleto
# morre quando chega um commit novo na mesma ref. Efeito colateral bem-vindo:
# deixa de gastar minutos de runner testando um commit que já foi substituído.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    # ⚠️ Sem `timeout-minutes` o job herda o teto PADRÃO do GitHub: **6 horas**.
    #
    # Em 31/08/2026 (run 33365701785, PR #1009) o step do E2E logado pendurou
    # sem imprimir uma linha sequer e só morreu nesse limite: 6 h de runner
    # queimadas por uma falha que se resolve em minutos — e, enquanto ele
    # pendura, NENHUM PR do repositório consegue ficar verde. O rerun do mesmo
    # commit passou em 9,3 min, ou seja, é intermitente e vai voltar.
    #
    # O job leva ~10 min; 30 cobre com folga o pior caso legítimo (espera do
    # preview da Vercel, até 10 min, + build + suíte).
    timeout-minutes: 30
    env:
      # O contexto `secrets` não está disponível em `if:` de step — usar ali faz
      # o workflow inteiro falhar antes de rodar ("workflow file issue"), como
      # aconteceu no run 31918472665. A leitura vai para env no nível do JOB,
      # onde `secrets` é válido, e os steps decidem por env.
      TEM_E2E_LOGIN: ${{ secrets.E2E_USER_EMAIL != '' && secrets.E2E_USER_PASSWORD != '' }}
      TEM_SUPABASE_PUBLICO: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
      # O app precisa TAMBÉM da service role para servir o dashboard (bootstrap
      # e telemetria usam admin client). Medido no run de 16/08: com as chaves
      # públicas o LOGIN funciona, mas a lista de treinos não carrega e o job
      # falha em "a lista de treinos precisa ter ao menos um card".
      #
      # ⚠️ Esta chave NÃO deve ser adicionada aqui enquanto o repositório for
      # PÚBLICO: ela ignora RLS e alcança os dados de todos os usuários. O
      # caminho certo é apontar o E2E para o deploy de PREVIEW da Vercel (que já
      # tem as variáveis no ambiente correto) ou usar um projeto Supabase de
      # teste com chave própria. Enquanto isso, o passo fica pulado — e pulado
      # é honesto; vermelho por configuração ensina a ignorar o vermelho.
      TEM_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      # Token "Protection Bypass for Automation" da Vercel (Settings →
      # Deployment Protection). Permite que a automação alcance o PREVIEW deste
      # PR, que tem Vercel Authentication ligada. É escopo de deployment — não
      # dá acesso a banco nem a dados; por isso pode viver aqui, ao contrário
      # da service role.
      TEM_BYPASS_VERCEL: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Key material guard
      run: node scripts/scan-key-material.mjs

    - name: Type Check (tsc)
      run: npx tsc --noEmit
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"

    - name: Lint
      run: npm run lint

    - name: Unit Tests (Vitest)
      run: npm run test:unit -- --reporter=verbose
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"

    - name: Smoke Tests
      run: npm run test:smoke

    - name: Verify Build
      run: npm run build
      env:
        # Usa as chaves REAIS quando o repositório as tiver (são NEXT_PUBLIC_,
        # portanto públicas por definição — vão no bundle que qualquer usuário
        # baixa). Sem elas, cai no placeholder: o build valida, mas o app não
        # conecta e o E2E logado abaixo é pulado.
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

    # E2E de navegador — só a fatia que NÃO depende de login nem de dado real:
    # as páginas públicas carregam, as protegidas redirecionam (em vez de dar
    # 500) e a árvore de acessibilidade das telas públicas continua íntegra.
    # Medido antes de ligar: 29 testes, 2 rodadas seguidas, 100% verdes e ~5 s.
    # Os specs `authenticated-*` ficam DE FORA — exigem E2E_USER_EMAIL/PASSWORD
    # como secrets do repositório (decisão do dono) — e `visual-regression`
    # também, porque comparação de screenshot entre máquinas diferentes é flake
    # por construção. Reaproveita o build do passo acima via `npm run start`.
    - name: Install Playwright browser (chromium)
      run: npx playwright install --with-deps chromium

    # ── E2E LOGADO — roda contra o PREVIEW da Vercel deste PR ──────────────
    #
    # Por que não subir o app aqui, como faz o E2E público: o dashboard precisa
    # de SUPABASE_SERVICE_ROLE_KEY (bootstrap e telemetria usam admin client), e
    # essa chave ignora RLS e alcança os dados de TODOS os usuários — não entra
    # nos secrets de um repositório PÚBLICO. Medido em 16/08: com só as chaves
    # públicas, o login passa e a lista de treinos nunca carrega.
    #
    # O preview da Vercel já roda com as variáveis certas, no ambiente certo, e
    # é exatamente o build que vai para produção. O acesso usa o token de bypass
    # de automação (escopo de deployment, não de dados).
    - name: Aguarda o preview da Vercel deste commit
      id: preview
      if: env.TEM_E2E_LOGIN == 'true' && env.TEM_BYPASS_VERCEL == 'true' && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # A Vercel publica o deployment no próprio GitHub; lemos o
        # environment_url de lá em vez de precisar de um token da Vercel.
        for i in $(seq 1 60); do
          url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=20" \
            --jq '.[].id' 2>/dev/null | while read -r id; do
              gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=10" \
                --jq '.[] | select(.state=="success") | .environment_url' 2>/dev/null
            done | grep -m1 -E '^https://.+' || true)
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Preview pronto: $url"
            exit 0
          fi
          sleep 10
        done
        echo "Preview não ficou pronto em 10 min — o passo seguinte será pulado."

    - name: E2E — jornada logada (Playwright)
      # Teto próprio, mais apertado que o do job: este step já pendurou DUAS
      # vezes (46 min em 18/08/2026, 6 h em 31/08/2026) e, com
      # `--reporter=github`, pendurado é indistinguível de rodando — o reporter
      # do GitHub não escreve em stdio, e a linha "Running N tests" que aparece
      # no CI vem do reporter `dot` que o Playwright acrescenta no `onBegin`,
      # DEPOIS do globalSetup. Silêncio total só prova que não passou dali.
      #
      # A ordem das defesas importa: o `globalTimeout` do playwright.config
      # (8 min) aborta primeiro e DIZ o motivo; este teto é o que sobra quando o
      # processo está travado demais para se abortar sozinho.
      timeout-minutes: 10
      if: steps.preview.outputs.url != ''
      run: npx playwright test --project=authenticated e2e/authenticated-workout-journey.spec.ts --reporter=github
      env:
        # Sem PLAYWRIGHT_CI_SERVER: o app já está no ar no preview; subir um
        # servidor local aqui seria testar outro binário e sem as variáveis.
        PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
        E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    - name: E2E — public pages (Playwright)
      # Mesmo teto do irmão logado, por CLASSE e não por sintoma: o que pendura
      # calado é `npx playwright test`, e este step roda o mesmo binário. Ele
      # leva ~5 s (29 testes medidos); 10 min é folga, não expectativa.
      timeout-minutes: 10
      run: npx playwright test --project=chromium e2e/pages-smoke.spec.ts e2e/pages-smoke-protected.spec.ts e2e/accessibility.spec.ts --reporter=github
      env:
        PLAYWRIGHT_CI_SERVER: "1"
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"
